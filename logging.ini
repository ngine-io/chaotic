; JSON logging, useful when shipping logs to a collector.
; Point $CHAOTIC_LOG_CONFIG at this file, or drop it into the working directory.
[loggers]
keys=root

[handlers]
keys=stream_handler

[formatters]
keys=json

[logger_root]
level=INFO
handlers=stream_handler

[handler_stream_handler]
class=StreamHandler
level=INFO
formatter=json
args=(sys.stdout,)

[formatter_json]
format = %(asctime)s %(name)-12s %(levelname)-8s %(message)s
class = pythonjsonlogger.json.JsonFormatter
