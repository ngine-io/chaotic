---
kind: nomad
dry_run: true
excludes:
  weekdays:
    - Sun
    - Sat
  times_of_day:
    - 22:00-08:00
    - 11:00-14:00
  days_of_year:
    - Jan01
    - Apr01
    - May01
    - Aug01
    - Dec24
configs:
  # One entry is picked at random per run
  experiments:
    - job
    - node

  ## Job experiment configs
  # Required for the 'job' experiment
  namespace_denylist:
    - default
  signals:
    - SIGKILL
  job_type_skiplist:
    - system
    - batch
    - sysbatch
  job_skiplist:
    - prometheus
  # Optional: add a meta tag in your nomad job "chaotic" = False to opt-out
  job_meta_opt_key: chaotic

  ## Node experiment configs
  node_drain_deadline_seconds: 15
  node_class_skiplist:
    - storage
  node_skiplist:
    - node1
    - node2
  node_wait_for: 100
  node_drain_system_jobs: true
  node_drain_amount_in_percent: 66
