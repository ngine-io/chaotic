---
kind: proxmox
dry_run: true
configs:
  # Optional: do not shut down VMs having a lower uptime in minutes
  min_uptime: 60

  # Optional: tag to select VMs for chaos actions, only VMs with this tag are considered
  # filter_tag: chaos-target

  # Optional: tag to skip VMs from chaos actions, even if they have the filter_tag
  # skip_tag: chaos-skip

  # Optional: list of VM names to skip from chaos actions, even if they have the filter_tag
  denylist:
    - example-vm1
    - example-vm2

  # Optional: 60 seconds is the default
  wait_before_restart: 60
