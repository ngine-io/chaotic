site_name: Chaotic - Chaos for Clouds
site_description: Chaos engineering for clouds, Proxmox and HashiCorp Nomad.
repo_url: https://github.com/ngine-io/chaotic
edit_uri: edit/master/docs/
nav:
  - Home: index.md
  - Install: install.md
  - Settings: settings.md
  - Configs:
      - Apache CloudStack: configs/cloudstack.md
      - DigitalOcean: configs/digitalocean.md
      - Vultr: configs/vultr.md
      - cloudscale.ch: configs/cloudscale_ch.md
      - Hetzner Cloud: configs/hetzner.md
      - Proxmox: configs/proxmox.md
      - Hashicorp Nomad: configs/nomad.md
  - Run: running.md
  - Development: development.md

theme:
  name: material
  palette:
    - scheme: default
      primary: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    - scheme: slate
      primary: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

  # Note: these belong to the theme, not to the top level of this file.
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - content.action.edit
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
